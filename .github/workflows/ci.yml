name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ vars.FLEET_ENABLED == 'true' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      # Real-error gate only: black/isort own style. Full-flake8 legacy
      # style debt is tracked separately and is not gated here.
      - name: Lint (flake8 E9,F)
        run: uv run flake8 --select=E9,F blockauth/

      - name: Check formatting (black)
        run: uv run black --check blockauth/

      - name: Check import order (isort)
        run: uv run isort --check-only blockauth/

      - name: Audit dependencies
        run: uv audit --locked
